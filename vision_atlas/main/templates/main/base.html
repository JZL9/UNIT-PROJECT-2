{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="{{ request.COOKIES.theme|default:'light' }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vision Atlas{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
</head>

<body class="d-flex flex-column min-vh-100 {% block body_class %}{% endblock %}">
    <div class="scroll-progress" aria-hidden="true"></div>

    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'main:home' %}">Vision Atlas</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="{% url 'main:home' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'main:home' %}#projects">Projects</a></li>
                    <li class="nav-item ms-lg-3">
                        {% if request.COOKIES.theme == 'dark' %}
                            <a href="{% url 'main:set_theme' %}?theme=light&next={{ request.path }}" class="btn btn-outline-success btn-sm">
                                <i class="bi bi-sun"></i>
                            </a>
                        {% else %}
                            <a href="{% url 'main:set_theme' %}?theme=dark&next={{ request.path }}" class="btn btn-outline-success btn-sm">
                                <i class="bi bi-moon-stars"></i>
                            </a>
                        {% endif %}
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="text-center py-4 bg-body-tertiary">
        <p class="mb-0">Vision Atlas &copy; 2026</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'main/js/design.js' %}"></script>
</body>

</html>
